# Local Redis for queues (and optional cache). Not used by production Coolify deploy.
#
# Start:  docker compose -f docker-compose.redis.yml up -d
# Stop:   docker compose -f docker-compose.redis.yml down
#
# Then set in .env: QUEUE_CONNECTION=redis, REDIS_HOST=127.0.0.1, REDIS_CLIENT=predis

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
