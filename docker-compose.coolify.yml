# Production deploy (Coolify). Use Coolify managed Redis — set REDIS_URL in the app service env.
# Do not commit real credentials; paste REDIS_URL in Coolify environment variables only.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sky-line-erp:latest
    ports:
      - "80:80"
    environment:
      RUN_MIGRATIONS: "true"
      RUN_OPTIMIZE: "true"
      RUN_STORAGE_LINK: "true"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      ASSET_URL: "${APP_URL}"
      FORCE_HTTPS: "true"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST}"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      QUEUE_CONNECTION: redis
      QUEUE_WORKER_QUEUES: "data-transfer-heavy,data-transfer,default,ird"
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_URL: "${REDIS_URL}"
      REDIS_QUEUE_CONNECTION: queue
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"
      REDIS_QUEUE_DB: "2"
      REDIS_QUEUE_RETRY_AFTER: "3900"
      FILESYSTEM_DISK: public
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-}"
      MAIL_FROM_NAME: "${APP_NAME:-Sky Line ERP}"
      VITE_APP_NAME: "${APP_NAME:-Sky Line ERP}"
    volumes:
      - storage_data:/var/www/html/storage/app
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  storage_data:

networks:
  coolify:
    external: true
